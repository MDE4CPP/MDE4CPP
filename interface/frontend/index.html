<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MDE4CPP Build Service</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🔧 MDE4CPP Build Service</h1>
            <p class="subtitle">Upload your model files and get compiled DLLs and executables</p>
        </header>

        <main>
            <!-- File Upload Section -->
            <section id="upload-section" class="upload-section">
                <div id="drop-zone" class="drop-zone">
                    <div class="drop-zone-content">
                        <svg class="upload-icon" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                        <h2>Drag & Drop Your Model File</h2>
                        <p>or <button class="file-button">Browse Files</button></p>
                        <p class="file-info">Supported formats: .ecore, .uml</p>
                        <input type="file" id="file-input" accept=".ecore,.uml" hidden>
                    </div>
                </div>
            </section>

            <!-- Build Status Section -->
            <section id="status-section" class="status-section hidden">
                <div class="status-card">
                    <div class="status-header">
                        <h2>Build Status</h2>
                        <span id="build-id" class="build-id"></span>
                    </div>
                    
                    <div class="status-info">
                        <div class="status-badge" id="status-badge">
                            <span id="status-text">Initializing...</span>
                        </div>
                        <div class="progress-container">
                            <div class="progress-bar">
                                <div id="progress-fill" class="progress-fill" style="width: 0%"></div>
                            </div>
                            <span id="progress-text" class="progress-text">0%</span>
                        </div>
                    </div>

                    <div class="status-details">
                        <div class="detail-item">
                            <span class="detail-label">Stage:</span>
                            <span id="stage-text" class="detail-value">-</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Message:</span>
                            <span id="message-text" class="detail-value">-</span>
                        </div>
                    </div>

                    <div id="logs-container" class="logs-container hidden">
                        <h3>Build Logs</h3>
                        <div id="logs-content" class="logs-content"></div>
                    </div>
                </div>
            </section>

            <!-- Download Section -->
            <section id="download-section" class="download-section hidden">
                <div class="download-card">
                    <h2>📦 Download Build Artifacts</h2>
                    <div id="download-files" class="download-files">
                        <!-- Files will be populated here -->
                    </div>
                    <div class="download-actions">
                        <button id="download-all-btn" class="btn btn-primary">
                            📥 Download All (ZIP)
                        </button>
                        <button id="download-dlls-btn" class="btn btn-secondary">
                            📥 Download DLLs
                        </button>
                        <button id="download-exes-btn" class="btn btn-secondary">
                            📥 Download Executables
                        </button>
                    </div>
                </div>
            </section>

            <!-- Error Section -->
            <section id="error-section" class="error-section hidden">
                <div class="error-card">
                    <h2>❌ Build Failed</h2>
                    <p id="error-message"></p>
                    <button id="retry-btn" class="btn btn-primary">Try Again</button>
                </div>
            </section>
        </main>

        <footer>
            <p>MDE4CPP Build Service v1.0.0</p>
        </footer>
    </div>

    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
