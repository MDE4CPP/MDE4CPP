task buildOCLAll() { 
	group 'Source'
	description 'generate and compile All OCL components meta-model and parser'
	
	dependsOn 'ecore:buildEcore'
	// OCL tasks are usually not optional - but skip if not available
	project.afterEvaluate {
		def buildOclTask = getRootProject().tasks.findByPath(':src:ocl:oclModel:buildOcl')
		def buildOclParserTask = getRootProject().tasks.findByPath(':src:ocl:oclParser:buildOclParser')
		if (buildOclTask) {
			tasks.buildOCLAll.dependsOn buildOclTask
		}
		if (buildOclParserTask) {
			tasks.buildOCLAll.dependsOn buildOclParserTask
		}
		def buildEcoreTask = getRootProject().tasks.findByPath(':src:ecore:buildEcore')
		if (buildEcoreTask && buildOclTask) {
			buildOclTask.mustRunAfter buildEcoreTask
		}
		if (buildEcoreTask && buildOclParserTask) {
			buildOclParserTask.mustRunAfter buildEcoreTask
		}
	}
}	

task compileEcoreModels(){
	group 'Source'
	description 'compile all ecore models'

	dependsOn 'ecore:compileEcore'
	dependsOn 'uml:types:compileTypes'
	dependsOn 'uml:uml:compileUml'
	dependsOn 'fuml:compileFUML'
	dependsOn 'pscs:compilePSCS'
	dependsOn 'pssm:compilePSSM'
	
	mustRunAfter =  ['ecore:generateEcore'
		, 'uml:types:generateTypes'
		, 'uml:uml:generateUml'
		, 'fuml:generateFUML'
		, 'pscs:generatePSCS'
		, 'pssm:generatePSSM'
		, 'ocl:oclModel:generateOcl'
			]
}

// Compile all without generating the models
