x-base-service: &base-service
  build:
    context: ..
    dockerfile: docker/Dockerfile
  image: mde4cpp:latest
  user: mde4cpp
  working_dir: /home/mde4cpp
  volumes:
    - ../:/home/mde4cpp
  entrypoint: ["/bin/bash", "/home/mde4cpp/docker/scripts/entrypoint.sh"]

services:
  # Generators
  # ============================================================================

  # Build all generators (ecore4CPP, UML4CPP, fUML4CPP)
  # Usage: docker compose up build-generators
  build-generators:
    profiles: ["generators"]
    <<: *base-service
    container_name: mde4cpp-build-generators
    command: /bin/bash -c "./application/tools/gradlew generator:ecore4CPP:buildGenerator_ecore4CPP --no-daemon && ./application/tools/gradlew generator:UML4CPP:buildGenerator_UML4CPP --no-daemon && ./application/tools/gradlew generator:fUML4CPP:buildGenerator_fUML4CPP --no-daemon"
  # Generate ecore4CPP generator
  # Usage: docker compose up generate-ecore4cpp-generator
  generate-ecore4cpp-generator:
    profiles: ["generators"]
    <<: *base-service
    container_name: mde4cpp-generate-ecore4cpp-generator
    command: ./application/tools/gradlew generator:ecore4CPP:buildGenerator_ecore4CPP --no-daemon
  # Generate UML4CPP generator
  # Usage: docker compose up generate-uml4cpp-generator
  generate-uml4cpp-generator:
    profiles: ["generators"]
    <<: *base-service
    container_name: mde4cpp-generate-uml4cpp-generator
    command: ./application/tools/gradlew generator:UML4CPP:buildGenerator_UML4CPP --no-daemon
  # Generate fUML4CPP generator
  # Usage: docker compose up generate-fuml4cpp-generator
  generate-fuml4cpp-generator:
    profiles: ["generators"]
    <<: *base-service
    container_name: mde4cpp-generate-fuml4cpp-generator
    command: ./application/tools/gradlew generator:fUML4CPP:buildGenerator_fUML4CPP --no-daemon
  # ============================================================================
