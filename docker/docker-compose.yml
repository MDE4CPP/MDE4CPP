  # ============================================================================

  # Build UML4CPP profile model (generate + compile)
  # Usage: docker compose up build-uml4cpp-profile
  build-uml4cpp-profile:
    <<: *base-service
    container_name: mde4cpp-build-uml4cpp-profile
    command: /bin/bash -c "./application/tools/gradlew src:common:UML4CPPProfile:generateUML4CPPProfile --no-daemon && ./application/tools/gradlew src:common:UML4CPPProfile:compileUML4CPPProfile --no-daemon"
  # Generate UML4CPP profile model
