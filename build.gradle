import org.gradle.internal.os.OperatingSystem;

description 'MDE4CPP root project'

task generateAll() {
	group 'MDE4CPP'
	description 'Generate all models without compilation of generated source code'

	dependsOn 'generator:createAllGenerators'
	dependsOn 'src:generateEcoreModels' // includes OCL model & Parser
	dependsOn 'src:generateReflectionModels'
	dependsOn 'src:generateUMLProfiles'
	dependsOn 'src:common:FoundationalModelLibrary:generateFoundationalModelLibrary'
}

task compileCommonTools()
{
	group 'MDE4CPP'
	description 'Compile all used external tools'

	dependsOn 'src:deliverBasicInterfaces'
	dependsOn 'src:common:pluginFramework:compilePluginFramework'
	dependsOn 'src:common:persistence:compilePersistence'
}	

task compileAll() 
{
	group 'MDE4CPP'
	description 'Compile all generated source code of models without generating the models'

	dependsOn 'src:compileEcoreModels'
	dependsOn 'src:compileReflectionModels'
	dependsOn 'src:compileUMLProfiles'
	dependsOn 'src:compileOCLAll'

	dependsOn 'src:common:FoundationalModelLibrary:compileFoundationalModelLibrary'	
}

task buildAll() 
{
	group 'MDE4CPP'
	description 'build generators and all models'
	dependsOn 'compileCommonTools'
	dependsOn 'generateAll'
	dependsOn 'compileAll'
	dependsOn 'src:buildOCLAll'

	tasks.getByPath('compileCommonTools').mustRunAfter tasks.getByPath('generateAll')	
	tasks.getByPath('compileAll').mustRunAfter tasks.getByPath('compileCommonTools')
	tasks.getByPath('src:buildOCLAll').mustRunAfter tasks.getByPath('generateAll')
}


