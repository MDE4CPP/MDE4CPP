# Platform-independent version configuration for MDE4CPP
# This file is read by platform-specific bootstrap scripts and setenv scripts
# to ensure consistent tool versions across all platforms and build systems

# Java version (used by Gradle and other build tools)
MDE4CPP_JAVA_VERSION=21

# C++ Compiler version (GCC for Windows, Linux, and Mac)
MDE4CPP_COMPILER_VERSION=13.2.0

# CMake version
MDE4CPP_CMAKE_VERSION=4.3
MDE4CPP_CMAKE_BUILD=1

# Eclipse versions (for model generators and development)
MDE4CPP_ECLIPSE_VERSION=2025-09
MDE4CPP_ECLIPSE_MILESTONE=R
MDE4CPP_ECLIPSE_ACCELEO_VERSION=3.7
MDE4CPP_ECLIPSE_PAPYRUS_VERSION=7.1.0
MDE4CPP_ECLIPSE_PAPYRUS_UPDATE_VERSION=2024-06
MDE4CPP_ECLIPSE_SIRIUS_VERSION=7.4.11
MDE4CPP_ECLIPSE_SIRIUS_ECLIPSE_VERSION=2023-03

# External dependencies
MDE4CPP_XERCES_VERSION=3.3.0
MDE4CPP_ANTLR_VERSION=4.13.2

# Eclipse plugins required by MDE4CPP are listed in bootstrap/eclipse_plugins.txt
# General Configuration for all Generator 

#defines the root destination folder for all generated files: $MDE4CPP_Hope$/<rootTargetFolder>
useRootTargetFolder = false
rootTargetFolder = src_gen

# Define the Level of debug messages during generation (0)
GenerateDebugInfo = true

# Info as well as warning messages can also be disabled from a specific level of depth (0-4)
# See examples below:
#	disableInfos(2) - disables all warnings with level >= 2
# 	disableWarnigs(1) - disables all warnings with level >= 1
# Providing a level of 0 to these calls is equivalent to a call to disable*All()
InfoLevel = 2
WarningLevel = 1

# defines if the Rest-API shpuld be generated or not
GenerateRestApi = false
# Cross-compilation to Windows (only effective when building on Linux)
# Set to 'true' to generate Windows binaries (.dll, .exe) on Linux
# Set to 'false' or leave unset for normal Linux build (.so, ELF binaries)
CROSS_COMPILE_WINDOWS=false
