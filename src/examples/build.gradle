task generateEcoreTestSuite() {
	group 'Tests'
	description 'generate test suite for ecore'	
	
	doLast {	
		def tool = '/bin/sh'
		def command = '-c'
		def prefix = './'
		
		if (System.properties['os.name'].toLowerCase().contains('windows')) {
			tool = 'cmd'
			command = '/C'
			prefix = ''
		}
	
		[  	 './ecoreExamples/TestSuite/SubsetUnionExample/SubsetUnion/model'
			,'./ecoreExamples/TestSuite/SubsetUnionExample/SubsetUnionDepth/model'
//			,'./ecoreExamples/TestSuite/SubPackagetest/model'						
			,'./ecoreExamples/TestSuite/copyTest/model'
			,'./ecoreExamples/TestSuite/templateTest/model'
		].each { path ->
			def buildModelFile = file(path + File.separator +'build.gradle')
			def buildSrcFile = file(path+'../src_gen'+ File.separator +'build.gradle')
			if(!(buildFile.exists() && buildSrcFile.exists()))
			{
				exec
				{
					workingDir = file("${path}"+ File.separator)					
					commandLine = [tool, command, prefix + 'generate']
				}
			}
		}
	} 			
}

