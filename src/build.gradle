	dependsOn 'common:UML4CPPProfile:compileUML4CPPProfile'
}

task compileOCLAll() {
	group 'Source'
	description 'compile OCL meta-model and parser'

	dependsOn 'ecore:buildEcore'
	// OCL tasks are not optional - but skip if not available
	project.afterEvaluate {
		def compileOclTask = getRootProject().tasks.findByPath(':src:ocl:oclModel:compileOcl')
		def compileOclParserTask = getRootProject().tasks.findByPath(':src:ocl:oclParser:compileOclParser')
		if (compileOclTask) {
			tasks.compileOCLAll.dependsOn compileOclTask
		}
		if (compileOclParserTask) {
			tasks.compileOCLAll.dependsOn compileOclParserTask
		}
		def buildEcoreTask = getRootProject().tasks.findByPath(':src:ecore:buildEcore')
		if (buildEcoreTask && compileOclTask) {
			compileOclTask.mustRunAfter buildEcoreTask
		}
		if (buildEcoreTask && compileOclParserTask) {
			compileOclParserTask.mustRunAfter buildEcoreTask
		}
		// Also ensure runCommandCompile tasks wait for buildEcore (if they exist)
		def oclRunCommandTasks = ['ocl:oclModel:runCommandCompileOcl']
		oclRunCommandTasks.each { taskPath ->
			def oclTasks = getRootProject().getTasksByName(taskPath, true)
			if (!oclTasks.isEmpty() && buildEcoreTask) {
				oclTasks.each { task -> task.mustRunAfter buildEcoreTask }
			}
		}
	}
}

