# General Configuration for all Generator 

#defines the root destination folder for all generated files: $MDE4CPP_Hope$/<rootTargetFolder>
useRootTargetFolder = false
rootTargetFolder = src_gen

# Define the Level of debug messages during generation (0)
GenerateDebugInfo = true 

# Info as well as warning messages can also be disabled from a specific level of depth (0-4)
# See examples below:
#	disableInfos(2) - disables all warnings with level >= 2
# 	disableWarnigs(1) - disables all warnings with level >= 1
# Providing a level of 0 to these calls is equivalent to a call to disable*All()
InfoLevel = 2
WarningLevel = 1

# defines if the Rest-API shpuld be generated or not
GenerateRestApi = false
# Cross-compilation to Windows (only effective when building on Linux)
# Set to 'true' to generate Windows binaries (.dll, .exe) on Linux
# Set to 'false' or leave unset for normal Linux build (.so, ELF binaries)
CROSS_COMPILE_WINDOWS=false
