repositories {
    mavenCentral()
}

configurations {
    antlrTool
}

dependencies {
    antlrTool "org.antlr:antlr4:${rootProject.ext.versions.antlr}"
}

task installAntlr {
    group 'Installation'
    description 'Resolve the ANTLR dependency for OCL parser generation'

    doLast {
        println "Installing ANTLR ${rootProject.ext.versions.antlr}"
        configurations.antlrTool.resolve()
    }
}
