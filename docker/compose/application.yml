x-base-service: &base-service
  build:
    context: ..
    dockerfile: Dockerfile
  image: mde4cpp:latest
  init: true
  user: mde4cpp
  working_dir: /home/mde4cpp
  volumes:
    - ../:/home/mde4cpp
    - gradle_cache:/home/mde4cpp/.gradle
    - eclipse_data:/home/eclipse
  entrypoint: ["/bin/bash", "/home/mde4cpp/docker/scripts/entrypoint.sh"]

services:
  # =============================================
  # Application Models: FoundationalModelLibrary
  # =============================================
  build-foundational-model-library:
    profiles: ["application"]
    <<: *base-service
    container_name: mde4cpp-build-foundational-model-library
    command: /bin/bash -c "./application/tools/gradlew src:common:FoundationalModelLibrary:generateFoundationalModelLibrary --no-daemon && ./application/tools/gradlew src:common:FoundationalModelLibrary:compileFoundationalModelLibrary --no-daemon"
  generate-foundational-model-library:
    profiles: ["application"]
    <<: *base-service
    container_name: mde4cpp-generate-foundational-model-library
    command: ./application/tools/gradlew src:common:FoundationalModelLibrary:generateFoundationalModelLibrary --no-daemon
  compile-foundational-model-library:
    profiles: ["application"]
    <<: *base-service
    container_name: mde4cpp-compile-foundational-model-library
