      "
  generate-pscs:
    profiles: ["fuml"]
    extends:
      file: base.yml
      service: base-service
    container_name: mde4cpp-generate-pscs
    command: ./application/tools/gradlew src:pscs:generatePSCS --no-daemon
  compile-pscs:
    profiles: ["fuml"]
    extends:
      file: base.yml
      service: base-service
    container_name: mde4cpp-compile-pscs
    command: ./application/tools/gradlew src:pscs:compilePSCS --no-daemon
  # =================
  # Core Models: PSSM
  # =================
  build-pssm:
    profiles: ["fuml"]
    extends:
      file: base.yml
      service: base-service
    container_name: mde4cpp-build-pssm
    command: >-
      /bin/bash -c "
      ./application/tools/gradlew src:pssm:generatePSSM --no-daemon &&
      ./application/tools/gradlew src:pssm:compilePSSM --no-daemon
      "
  generate-pssm:
    profiles: ["fuml"]
    extends:
      file: base.yml
