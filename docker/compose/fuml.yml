services:
  # ==================
  # Core Models: fUML
  # ==================
  build-fuml:
    profiles: ["fuml"]
    extends:
      file: base.yml
      service: base-service
    container_name: mde4cpp-build-fuml
    command: >-
      /bin/bash -c "
      ./application/tools/gradlew src:fuml:generateFUML --no-daemon &&
      ./application/tools/gradlew src:fuml:compileFUML --no-daemon
      "
  generate-fuml:
    profiles: ["fuml"]
    extends:
      file: base.yml
      service: base-service
    container_name: mde4cpp-generate-fuml
    command: ./application/tools/gradlew src:fuml:generateFUML --no-daemon
  compile-fuml:
    profiles: ["fuml"]
    extends:
      file: base.yml
      service: base-service
    container_name: mde4cpp-compile-fuml
    command: ./application/tools/gradlew src:fuml:compileFUML --no-daemon
  # ==================
  # Core Models: PSCS
  # ==================
  build-pscs:
