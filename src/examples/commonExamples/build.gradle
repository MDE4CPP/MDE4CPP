description 'Example collection'

import org.gradle.internal.os.OperatingSystem;

def commonExamples = 
[
//	[{example project directory}, {task name}]
	['./persistenceExample/', 'compileExamplePersistence'],
	['./pluginFrameworkExample/', 'compileExamplePluginFramework'],	
	['./SimpleUML/', 'compileExampleSimpleUML']
]

task compileCommonExamples() {
	group 'Examples'
	description 'compile common examples.'	
	
	doLast
	{
		def tool = '/bin/sh'
		def command = '-c'

		
		if (System.properties['os.name'].toLowerCase().contains('windows')) {
			tool = 'cmd'
			command = '/C'

		}
		
		commonExamples.each { taskVar ->
		// taskVar[0] = task project root directoy, taskVar[1] = task name
			exec
			{
				workingDir = file("${taskVar[0]}")
				commandLine = [tool, command, 'gradlew ' + taskVar[1]]
			}
		}
	}
}
